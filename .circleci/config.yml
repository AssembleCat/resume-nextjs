version: 2.1
orbs:
  node: circleci/node@5.2.0
jobs:
  build:
    executor:
      name: node/default
      tag: '20.15.1'
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: npm ci
      - run:
          name: Lint and typecheck
          command: npm run lint && npm run typecheck
      - run:
          name: Export static site
          command: npm run export
workflows:
  build:
    jobs:
      - build
